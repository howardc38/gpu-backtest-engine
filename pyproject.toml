[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gpu-backtest-engine"
version = "0.2.0"
description = "Pluggable GPU parameter sweeps with deterministic entry/exit effect-size analysis"
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "howardc38"}]
dependencies = ["numba>=0.65,<0.66", "numpy>=2.3,<2.5", "pandas>=2.2,<4"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "build>=1,<2", "ruff>=0.14,<1"]
viz = ["altair>=6,<7"]
cuda = ["numba-cuda>=0.30,<0.31; platform_system != 'Darwin'"]

[project.scripts]
gpu-backtest = "gpu_backtest.cli:main"

[project.urls]
Repository = "https://github.com/howardc38/gpu-backtest-engine"
Issues = "https://github.com/howardc38/gpu-backtest-engine/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
gpu_backtest = ["runpod_requirements.txt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = '-m "not gpu"'
markers = ["gpu: requires a real NVIDIA GPU and CUDA runtime"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
