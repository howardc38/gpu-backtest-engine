name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.12', '3.13']
        backend: [builtin, numba-cuda]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: python -m pip install -e '.[dev]'
      - if: matrix.backend == 'numba-cuda'
        # The device backend imports CUDA runtime metadata even for CPU-only tests.
        # Only the runtime is needed here; simulation does not require a GPU/driver.
        run: >-
          python -m pip install 'numba-cuda>=0.30,<0.31'
          'cuda-bindings>=12.9.1,<13' 'nvidia-cuda-runtime-cu12>=12.9,<13'
      - run: python -m pytest -q
      - run: ruff check .
      - run: ruff format --check .
      - run: python scripts/check_release.py
      - run: python -m build
